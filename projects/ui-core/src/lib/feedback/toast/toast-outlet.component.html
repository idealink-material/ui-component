@for (pos of positions; track pos) {
  @if (toastsForPosition(pos).length > 0) {
    <div class="p-toast-stack" [class]="'p-toast-stack--' + pos">

      @for (toast of toastsForPosition(pos); track toast.id) {
        <div class="p-toast"
          [class]="'p-toast--' + toast.level"
          role="alert"
          [attr.aria-live]="toast.level === 'error' ? 'assertive' : 'polite'">

          <cui-icon [name]="iconFor(toast.level)" size="sm"
            color="currentColor" class="p-toast__icon" />

          <div class="p-toast__body">
            @if (toast.title) {
              <p class="p-toast__title">{{ toast.title }}</p>
            }
            <p class="p-toast__message" [class.p-toast__message--with-title]="toast.title">
              {{ toast.message }}
            </p>
            @if (toast.actionLabel && toast.onAction) {
              <button class="p-toast__action" (click)="toast.onAction!()">
                {{ toast.actionLabel }}
              </button>
            }
          </div>

          @if (toast.dismissible) {
            <button class="p-toast__close"
              (click)="dismiss(toast.id)"
              aria-label="Dismiss notification">
              <cui-icon name="close" size="xs" color="currentColor" />
            </button>
          }
        </div>
      }
    </div>
  }
}
