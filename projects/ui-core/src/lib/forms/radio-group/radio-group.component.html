<mat-radio-group
  class="p-radio-group"
  [class.p-radio-group--horizontal]="orientation() === 'horizontal'"
  [name]="name()"
  [disabled]="disabled()"
  [required]="required()"
  (change)="onChange($event)">
  @for (option of options(); track getOptionValue(option)) {
    <mat-radio-button
      [value]="getOptionValue(option)"
      [checked]="isChecked(option)"
      [disabled]="getOptionDisabled(option)">
      {{ getOptionLabel(option) }}
    </mat-radio-button>
  }
</mat-radio-group>
