<div class="p-field" [class.p-field--full]="fullWidth()">
  @if (label()) {
    <label class="p-field__label" [for]="fieldId">
      {{ label() }}@if (required()) { <span class="p-field__required" aria-hidden="true">*</span> }
    </label>
  }

  <mat-form-field
    [appearance]="matAppearance()"
    subscriptSizing="dynamic"
    [class.p-input--sm]="size() === 'sm'"
    [class.p-input--lg]="size() === 'lg'"
    [class.p-input--full]="fullWidth()"
    class="p-input">

    @if (prefixIcon()) {
      <cui-icon matPrefix [name]="prefixIcon()!" size="sm"
        color="var(--mat-sys-on-surface-variant)" class="p-input__prefix-icon" />
    }
    <ng-content select="[prefixIcon]" />

    @if (multiline()) {
      <textarea matInput
        [id]="fieldId"
        [rows]="rows()"
        [cols]="cols() ?? null"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [readonly]="readonly()"
        [required]="required()"
        [class.p-input__textarea--autoresize]="autoResize()"
        [attr.aria-invalid]="hasError() ? 'true' : null"
        (input)="onInput($event)"
        (blur)="onBlur($event)"
        (focus)="onFocus($event)"></textarea>
    } @else {
      <input matInput
        [id]="fieldId"
        [type]="type()"
        [value]="value()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [readonly]="readonly()"
        [required]="required()"
        [autocomplete]="autocomplete()"
        [attr.aria-invalid]="hasError() ? 'true' : null"
        (input)="onInput($event)"
        (blur)="onBlur($event)"
        (focus)="onFocus($event)" />
    }

    @if (suffixIcon()) {
      <cui-icon matSuffix [name]="suffixIcon()!" size="sm"
        color="var(--mat-sys-on-surface-variant)" class="p-input__suffix-icon" />
    }
    <ng-content select="[suffixIcon]" />

    @if (hint() && !hasError()) {
      <mat-hint>{{ hint() }}</mat-hint>
    }
    @if (hasError()) {
      <mat-error>{{ error() }}</mat-error>
    }

  </mat-form-field>
</div>
