<div class="p-input-number" [class.p-input-number--full]="fullWidth()">
  @if (showButtons()) {
    <p-button variant="outlined" size="sm" iconLeft="remove"
      [disabled]="disabled() || atMin()" (onClick)="decrement()" />
  }
  <input type="text" inputmode="decimal" class="p-input-number__field"
    [value]="displayValue()"
    [disabled]="disabled()"
    [placeholder]="placeholder()"
    (input)="handleInput($event)"
    (focus)="handleFocus($event)"
    (blur)="handleBlur($event)">
  @if (showButtons()) {
    <p-button variant="outlined" size="sm" iconLeft="add"
      [disabled]="disabled() || atMax()" (onClick)="increment()" />
  }
</div>
