<ul class="p-listbox"
  cdkListbox
  [cdkListboxValue]="value()"
  [cdkListboxMultiple]="multiple()"
  [cdkListboxDisabled]="disabled()"
  (cdkListboxValueChange)="onValueChange($event.value)">
  @for (option of options(); track option.value) {
    <li class="p-listbox__option"
      [cdkOption]="option.value"
      [cdkOptionDisabled]="option.disabled">
      {{ option.label }}
    </li>
  }
</ul>
