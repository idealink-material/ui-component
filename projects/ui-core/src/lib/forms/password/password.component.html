<div class="p-field" [class.p-field--full]="fullWidth()">
  @if (label()) {
    <label class="p-field__label" [for]="fieldId">
      {{ label() }}@if (required()) { <span class="p-field__required" aria-hidden="true">*</span> }
    </label>
  }

  <mat-form-field appearance="outline" [class.p-password--full]="fullWidth()" class="p-password">
    <input matInput
      [id]="fieldId"
      [type]="inputType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      (input)="handleInput($event)"
      (focus)="handleFocus()"
      (blur)="handleBlur()" />

    @if (toggleMask()) {
      <button type="button" matIconSuffix class="p-password__toggle" (click)="toggleReveal()"
        [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'">
        <cui-icon [name]="revealed() ? 'visibility_off' : 'visibility'" size="sm" color="currentColor" />
      </button>
    }
  </mat-form-field>

  @if (feedback() && focused()) {
    <div class="p-password__feedback">
      @if (value()) {
        <div class="p-password__meter">
          <div class="p-password__meter-fill" [class]="'p-password__meter-fill--' + strength()"></div>
        </div>
        <span class="p-password__strength-label">{{ strengthLabel() }}</span>
      } @else {
        <span class="p-password__prompt">{{ promptLabel() }}</span>
      }
    </div>
  }
</div>
