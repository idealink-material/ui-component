@if (type() === 'submit') {
  <!-- The host renders as a custom `<p-button>` element, not a native <button>, so the
       browser's implicit "Enter submits the form" behavior has nothing to latch onto —
       this hidden native submit control gives it a real form control to find. -->
  <button type="submit" class="p-btn__native-submit" aria-hidden="true" tabindex="-1"></button>
}

<span class="p-btn__inner" (click)="handleClick($event)" matRipple
      [matRippleDisabled]="disabled() || loading()"
      [matRippleColor]="'var(--cui-btn-ripple, rgba(255,255,255,0.2))'">

  @if (loading()) {
    <span class="p-btn__spinner" aria-hidden="true"></span>
  } @else if (icon() && iconPos() == 'left') {
    <cui-icon [name]="icon()" [size]="iconSize()" color="currentColor" />
  }

  <span class="p-btn__label">
    <ng-content />
  </span>

  @if (!loading() && icon() && iconPos() == 'right') {
    <cui-icon [name]="icon()" [size]="iconSize()" color="currentColor" />
  }

</span>
