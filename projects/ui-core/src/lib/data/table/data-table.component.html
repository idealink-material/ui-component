<div class="p-data-table">

  <!-- Toolbar -->
  @if (searchable()) {
    <div class="p-data-table__toolbar">
      <p-input
        [value]="_search()"
        [placeholder]="searchPlaceholder()"
        prefixIcon="search"
        size="sm"
        [fullWidth]="false"
        (cuiChange)="onSearch($event)" />
      <ng-content select="p-data-table-actions" />
    </div>
  }

  <!-- Pagination (top) -->
  @if (paginator() && (paginatorPosition() === 'top' || paginatorPosition() === 'both')) {
    <div class="p-data-table__footer p-data-table__footer--top">
      <ng-container [ngTemplateOutlet]="paginatorTpl" />
    </div>
  }

  <!-- Table -->
  <p-table
    [columns]="columns()"
    [value]="value()"
    [loading]="loading()"
    [selectable]="selectable()"
    [selectionMode]="selectionMode()"
    [striped]="striped()"
    [scrollHeight]="scrollHeight()"
    [trackBy]="trackBy()"
    [expandable]="expandable()"
    [rowExpandMode]="rowExpandMode()"
    [rowDetailTemplate]="rowDetailTemplate()"
    [frozenValue]="frozenValue()"
    [virtualScroll]="virtualScroll()"
    [virtualScrollItemSize]="virtualScrollItemSize()"
    [resizableColumns]="resizableColumns()"
    [columnResizeMode]="columnResizeMode()"
    [reorderableColumns]="reorderableColumns()"
    [(selection)]="selection"
    [(expandedRowKeys)]="expandedRowKeys"
    [(sortField)]="sortField"
    [(sortOrder)]="sortOrder"
    (sortChange)="onSortChange($event)"
    (rowClick)="rowClick.emit($event)"
    (expandChange)="expandChange.emit($event)"
    (onRowSelect)="onRowSelect.emit($event)"
    (onRowUnselect)="onRowUnselect.emit($event)"
    (onHeaderCheckboxToggle)="onHeaderCheckboxToggle.emit($event)"
    (onRowExpand)="onRowExpand.emit($event)"
    (onRowCollapse)="onRowCollapse.emit($event)"
    (onColResize)="onColResize.emit($event)"
    (onColReorder)="onColReorder.emit($event)" />

  <!-- Pagination (bottom) -->
  @if (paginator() && (paginatorPosition() === 'bottom' || paginatorPosition() === 'both')) {
    <div class="p-data-table__footer">
      <ng-container [ngTemplateOutlet]="paginatorTpl" />
    </div>
  }

</div>

<ng-template #paginatorTpl>
  <p-pagination
    [page]="page()"
    [pageSize]="pageSize()"
    [total]="total()"
    [pageSizes]="pageSizes()"
    (pageChange)="onPageChange($event)" />
</ng-template>
