<div class="doc-example">
  @if (title()) {
    <h3 class="doc-example__title">{{ title() }}</h3>
  }
  @if (description()) {
    <p class="doc-example__description">{{ description() }}</p>
  }

  <div class="doc-example__box">
    <div class="doc-example__preview">
      <ng-content />
    </div>
    <div class="doc-example__toolbar">
      @if (sourceId()) {
        <span class="doc-example__tag">{{ sourceId() }}</span>
      }
      <span class="doc-example__spacer"></span>
      <button type="button" class="doc-example__icon-btn" (click)="toggleCode()" [attr.aria-pressed]="showCode()" title="View code">
        &lt;/&gt;
      </button>
    </div>
  </div>

  @if (showCode()) {
    @if (hasTsTab()) {
      <div class="doc-example__tabs" role="tablist">
        <button
          type="button"
          role="tab"
          class="doc-example__tab"
          [class.doc-example__tab--active]="activeTab() === 'html'"
          [attr.aria-selected]="activeTab() === 'html'"
          (click)="setTab('html')">
          HTML
        </button>
        <button
          type="button"
          role="tab"
          class="doc-example__tab"
          [class.doc-example__tab--active]="activeTab() === 'ts'"
          [attr.aria-selected]="activeTab() === 'ts'"
          (click)="setTab('ts')">
          TypeScript
        </button>
      </div>

      @if (activeTab() === 'html') {
        <app-doc-code [code]="code()" language="html" />
      } @else {
        <app-doc-code [code]="tsCode()" language="ts" />
      }
    } @else {
      <app-doc-code [code]="code()" language="html" />
    }
  }
</div>
